name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - LG webOS (.ipk)
        - Linux UI preview
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model and system version
      placeholder: "e.g. LG OLED65C9, webOS 4.10 / Ubuntu Linux"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nuvio version
      description: Settings › About shows it.
      placeholder: "e.g. 2.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
      description: Steps to reproduce help a lot. A photo or short video of the screen is welcome.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Local log
      description: Attach the local log file or paste the relevant excerpts here.
