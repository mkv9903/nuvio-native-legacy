[package]
name = "nuvio-rust-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[workspace]

[features]
default = []
webos = []

[dependencies]
ab_glyph = "=0.2.29"
base64 = "=0.22.1"
glow = "=0.13.1"
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "=0.8.9"
sdl2 = { version = "=0.35.2", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ureq = { version = "=3.3.0", default-features = false, features = ["rustls", "gzip"] }
url = "=2.5.8"
uuid = { version = "=1.11.1", features = ["v4"] }
zeroize = "=1.8.1"

[profile.release]
panic = "abort"
opt-level = 2
debug = 2
codegen-units = 1
lto = "thin"
