[package]
name = "nuvio-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
webos = []
native-ui-tests = []

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls", "gzip"] }
url = "=2.5.8"
uuid = { version = "=1.11.1", features = ["v4", "serde"] }
zeroize = "=1.8.1"
libc = "=0.2.190"
ring = "=0.17.14"

[profile.release]
panic = "abort"
opt-level = 2
debug = 2
codegen-units = 1
lto = "thin"
